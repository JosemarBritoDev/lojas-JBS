services:
  - type: web
    name: loja-jbs
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: loja-jbs-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"

databases:
  - name: loja-jbs-db
    databaseName: lojajbs_prod
    user: lojajbs_user
